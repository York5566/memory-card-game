<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="{{DESCRIPTION}}">
  <meta name="theme-color" content="#f7f8f2">
  <title>{{TITLE}} · {{NAME}}</title>
  {{META}}
  <link rel="icon" type="image/svg+xml" href="{{BASE}}assets/favicon.svg">
  <link rel="stylesheet" href="{{BASE}}style.css">
  <script type="module" src="{{BASE}}js/site.js"></script>
</head>
<body data-page="{{PAGE}}" data-base="{{BASE}}">
  <a class="skip" href="#main">跳到主要內容</a>

  <footer class="site-footer"><span>{{NAME}} <span class="muted">・ 一點空檔，一點樂趣</span></span><a href="{{BASE}}privacy/">隱私權說明</a></footer>
