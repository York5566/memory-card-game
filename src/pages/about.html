<article class="prose"><p class="eyebrow">關於網站</p><h1>關於翻牌遊戲</h1><p>「{{NAME}}」是開發中的暫用站名。我們先做好一個可以直接玩的翻牌遊戲，再逐步加入實用的小工具與其他小遊戲。</p><p>翻牌遊戲使用內建插畫，免登入。你可以調整配對數量、限時與圖庫，也可以把它放大，和身邊的人輪流挑戰。本次排行榜適合休閒遊玩及活動紀錄，不是防作弊的正式競賽系統。</p><h2>目前提供的內容</h2><p>翻牌遊戲、內建圖庫、畫面設定、本次排行榜，以及可自行啟用的瀏覽器本機成績紀錄。其他內容會在完成之後加入。</p><a class="button primary" href="{{BASE}}games/memory/">打開翻牌遊戲</a></article>
